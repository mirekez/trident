<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trident IDE</title>
  <link rel="stylesheet" href="/styles.css?v=10">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="launch-panel" id="launch-panel">
        <div class="launch-buttons" id="launch-buttons">Loading buttons...</div>
      </div>
    </aside>
    <section class="desktop" id="desktop" aria-label="Internal windows"></section>
    <div class="status-line" id="connection">Ready</div>
  </main>

  <template id="window-template">
    <article class="internal-window">
      <header class="window-titlebar">
        <h2></h2>
        <div class="window-actions">
          <button type="button" class="maximize-button" aria-label="Maximize window" title="Maximize">[]</button>
          <button type="button" class="close-button" aria-label="Close window" title="Close">x</button>
        </div>
      </header>
      <div class="window-content"></div>
    </article>
  </template>

  <script type="module" src="/app.js?v=10"></script>
</body>
</html>
